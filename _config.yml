theme: jekyll-theme-minimal
title: Сайт
description: Сайт
plugins:
  - jekyll-optional-front-matter   # обрабатывать md без шапки ---
  - jekyll-titles-from-headings    # заголовок страницы из первого # 
  - jekyll-relative-links          # работают ссылки между md-файлами
optional_front_matter:
  remove_originals: true
titles_from_headings:
  enabled: true
  strip_title: true
  collections: false
