<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url == '/' %}{{ site.title }}{% else %}{{ page.title | default: page.basename }} — {{ site.title }}{% endif %}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="channel">
    <div class="avatar">{{ site.title | slice: 0 }}</div>
    <div>
      <div class="name">{{ site.title }}</div>
      <div class="desc">{{ site.description }}</div>
    </div>
  </header>

  <main class="feed">
    {% if page.url == '/' %}
      {{ content }}
    {% else %}
      <article class="post">
        {{ content }}
        <div class="meta"><a href="{{ '/' | relative_url }}">← Вся лента</a></div>
      </article>
    {% endif %}
  </main>
</body>
</html>
